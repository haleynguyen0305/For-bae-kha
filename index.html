<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Bae ❤️</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
width:90%;
max-width:500px;
background:#1d1d1d;
padding:30px;
border-radius:20px;
text-align:center;
}

input{
width:90%;
padding:12px;
border-radius:10px;
border:none;
margin-top:15px;
font-size:18px;
}

button{
margin-top:20px;
padding:12px 30px;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
background:#ff5b8f;
color:white;
}

#letter{
display:none;
text-align:left;
margin-top:25px;
line-height:1.8;
}

</style>

</head>

<body>

<div class="box">

<h2>💌 Có một lá thư dành riêng cho chị...</h2>

<p>Nhập mật khẩu nha ❤️</p>

<input id="pw" type="password">

<br>

<button onclick="openLetter()">Mở thư</button>

<div id="letter">

<h2>Chúc mừng sinh nhật người em thương ❤️</h2>

<p>

Gửi chị ạ,

<br><br>

Em mong rằng tuổi mới của chị sẽ luôn có thật nhiều niềm vui, thật nhiều hạnh phúc...

<br><br>

(Đây chỉ là bản thử nha 😆)

</p>

</div>

</div>

<script>

function openLetter(){

let pw=document.getElementById("pw").value;

if(pw=="0305"){

document.getElementById("letter").style.display="block";

}else{

alert("Sai mật khẩu rồi bì 😝");

}

}

</script>

</body>

</html>
